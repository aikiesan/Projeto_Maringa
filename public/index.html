<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Repositório de Entrevistas de Maringá</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f6f8f6; --surface:#ffffff; --surface-2:#eef2ef; --surface-3:#e4eae6;
  --ink:#10201e; --ink-soft:#3b4b47; --muted:#61716c;
  --line:#dbe3df; --line-strong:#c3cec9;
  --accent:#0d6e63; --accent-soft:#e3f0ed;
  /* status (fixo, nunca tematizado) */
  --crit:#d03b3b; --warn:#fab219; --serious:#ec835a; --good:#0ca30c;
  --crit-ink:#a52c2c; --warn-ink:#8f6512;
  /* categórico: slots 2–6 (laranja, água, amarelo, magenta, verde) */
  --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4; --s5:#008300;
  /* sequencial: rampa azul, claro→escuro */
  --h0:transparent; --h1:#b7d3f6; --h2:#6da7ec; --h3:#2a78d6; --h4:#184f95;
  --h-ink1:#10201e; --h-ink2:#10201e; --h-ink3:#ffffff; --h-ink4:#ffffff;
  --shadow:0 1px 2px rgba(16,32,30,.05), 0 10px 28px -18px rgba(16,32,30,.22);
  --serif:"Newsreader",Georgia,serif;
  --sans:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0d1413; --surface:#141d1b; --surface-2:#1a2523; --surface-3:#22302d;
    --ink:#e7ede9; --ink-soft:#c2cec9; --muted:#8d9b96;
    --line:#26332f; --line-strong:#35443f;
    --accent:#54c3b1; --accent-soft:#12302c;
    --crit:#d03b3b; --warn:#fab219; --serious:#ec835a; --good:#0ca30c;
    --crit-ink:#e79b9b; --warn-ink:#d8ab5c;
    --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#008300;
    --h1:#1c5cab; --h2:#2a78d6; --h3:#5598e7; --h4:#9ec5f4;
    --h-ink1:#ffffff; --h-ink2:#ffffff; --h-ink3:#0b0b0b; --h-ink4:#0b0b0b;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0d1413; --surface:#141d1b; --surface-2:#1a2523; --surface-3:#22302d;
  --ink:#e7ede9; --ink-soft:#c2cec9; --muted:#8d9b96;
  --line:#26332f; --line-strong:#35443f;
  --accent:#54c3b1; --accent-soft:#12302c;
  --crit:#d03b3b; --warn:#fab219; --serious:#ec835a; --good:#0ca30c;
  --crit-ink:#e79b9b; --warn-ink:#d8ab5c;
  --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#008300;
  --h1:#1c5cab; --h2:#2a78d6; --h3:#5598e7; --h4:#9ec5f4;
  --h-ink1:#ffffff; --h-ink2:#ffffff; --h-ink3:#0b0b0b; --h-ink4:#0b0b0b;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(16px,3.5vw,40px)}
.col{max-width:70ch}

/* ---- cabeçalho ---- */
header{background:var(--surface);border-bottom:1px solid var(--line)}
.mast{padding:clamp(34px,5.5vw,60px) 0 26px}
.kicker{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);margin:0 0 16px}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.95rem,4.6vw,3rem);
  line-height:1.07;letter-spacing:-.018em;margin:0;text-wrap:balance}
.sub{font-family:var(--serif);font-size:clamp(1rem,2vw,1.2rem);line-height:1.5;
  color:var(--ink-soft);margin:16px 0 0;max-width:62ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  border-top:1px solid var(--line)}
.kpi{padding:18px 0 22px;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
@media (min-width:700px){.kpi{padding-left:20px}.kpi:first-child{padding-left:0}}
.kpi b{display:block;font-family:var(--serif);font-weight:500;font-size:1.9rem;
  line-height:1;letter-spacing:-.02em}
.kpi small{display:block;margin-top:6px;font-size:12px;color:var(--muted);line-height:1.35}

/* ---- seções ---- */
main{padding-bottom:88px}
section{padding-top:clamp(40px,5vw,60px)}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);display:flex;align-items:baseline;gap:14px;margin:0 0 12px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.4rem,3vw,1.95rem);
  line-height:1.16;letter-spacing:-.014em;margin:0 0 12px;text-wrap:balance}
h3{font-family:var(--sans);font-weight:700;font-size:.98rem;margin:28px 0 8px}
p{margin:0 0 14px}
code,.c{font-family:var(--mono);font-size:.85em;background:var(--surface-2);
  border:1px solid var(--line);border-radius:4px;padding:.08em .36em;white-space:nowrap}
a{color:var(--accent)}

/* ---- controles ---- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 4px}
.controls .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-right:4px}
button.chip{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-soft);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;
  padding:5px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  transition:background .12s,border-color .12s}
button.chip:hover{background:var(--surface-2)}
button.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button.chip .dot{width:9px;height:9px;border-radius:2px;flex:none}

/* ---- tabela ---- */
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--surface);margin:18px 0 0}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:840px}
caption{caption-side:bottom;text-align:left;font-size:12px;color:var(--muted);
  padding:9px 14px;border-top:1px solid var(--line);line-height:1.5}
th{text-align:left;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);padding:10px 12px;background:var(--surface-2);
  border-bottom:1px solid var(--line-strong);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.dim-row{opacity:.42}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono);font-size:12px;white-space:nowrap}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;vertical-align:baseline}

/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
  font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:.24em .5em;
  border-radius:3px;white-space:nowrap}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit-ink)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn-ink)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.neu{background:var(--surface-2);color:var(--muted)}

/* ---- barra empilhada ---- */
.stack{display:flex;gap:2px;height:34px;margin:16px 0 10px}
.stack>div{position:relative;display:flex;align-items:center;justify-content:center;
  border-radius:2px;min-width:2px}
.stack>div span{font-family:var(--mono);font-size:11px;font-weight:600;color:#0b0b0b;
  padding:0 4px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

/* ---- heatmap ---- */
.hm-wrap{overflow-x:auto;margin:18px 0 0;padding-bottom:4px}
.hm{min-width:1000px;font-family:var(--mono)}
.hm-axes,.hm-codes{display:grid;gap:2px;margin-left:var(--lblw)}
.hm-axis{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);padding:0 0 5px;border-bottom:2px solid var(--line-strong);
  margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hm-row{display:grid;gap:2px;align-items:center;margin-bottom:2px}
.hm-lbl{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;padding-right:10px;cursor:pointer;background:none;border:none;
  text-align:left;font-family:var(--mono)}
.hm-lbl:hover{color:var(--accent)}
.hm-lbl[aria-pressed="true"]{color:var(--accent);font-weight:600}
.hm-c{height:17px;border-radius:2px;cursor:pointer;background:var(--h0);
  box-shadow:inset 0 0 0 1px var(--line)}
.hm-c.h1{background:var(--h1);box-shadow:none}
.hm-c.h2{background:var(--h2);box-shadow:none}
.hm-c.h3{background:var(--h3);box-shadow:none}
.hm-c.h4{background:var(--h4);box-shadow:none}
.hm-c.sel{outline:2px solid var(--accent);outline-offset:1px}
.hm-c.z{position:relative}
.hm-c.z::after{content:"";position:absolute;inset:0;margin:auto;width:3px;height:3px;
  border-radius:50%;background:var(--line-strong)}
.hm-tot{display:grid;gap:2px;margin-left:var(--lblw);margin-top:8px;
  border-top:1px solid var(--line);padding-top:6px}
.hm-bar{height:26px;display:flex;align-items:flex-end}
.hm-bar i{display:block;width:100%;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px}
.hm-bar.zero i{background:var(--crit)}
.hm-scale{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px;
  font-size:12px;color:var(--muted)}
.hm-scale .g{display:flex;align-items:center;gap:5px}
.hm-scale .g i{width:15px;height:12px;border-radius:2px;display:block}

/* ---- tooltip ---- */
#tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--surface);border:1px solid var(--line-strong);box-shadow:var(--shadow);
  padding:9px 11px;font-size:12.5px;line-height:1.45;max-width:290px;border-radius:3px}
#tip b{display:block;font-size:12px;margin-bottom:3px}
#tip .m{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* ---- painel de detalhe ---- */
.panel{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);
  padding:18px 20px;margin:18px 0 0;box-shadow:var(--shadow)}
.panel .ph{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.panel h4{font-family:var(--serif);font-weight:500;font-size:1.25rem;line-height:1.25;margin:0 0 10px}
.panel .meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.kw{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 14px}
.kw span{font-family:var(--mono);font-size:11px;background:var(--surface-2);
  border:1px solid var(--line);border-radius:3px;padding:2px 6px;color:var(--ink-soft)}
button.x{background:none;border:1px solid var(--line-strong);border-radius:3px;color:var(--muted);
  font-family:var(--mono);font-size:11px;padding:3px 9px;cursor:pointer}
button.x:hover{color:var(--ink);border-color:var(--ink-soft)}
.covlist{display:grid;gap:5px;margin:0}
.covrow{display:grid;grid-template-columns:150px 1fr 46px;gap:10px;align-items:center;font-size:12.5px}
.covrow .b{height:11px;background:var(--surface-2);border-radius:2px;overflow:hidden}
.covrow .b i{display:block;height:100%;background:var(--h3);border-radius:2px}
.covrow .v{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;
  font-variant-numeric:tabular-nums}
.covrow .k{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}

/* ---- cobertura por dimensão ---- */
.axgrid{display:grid;gap:26px;margin:20px 0 0}
@media (min-width:860px){.axgrid{grid-template-columns:1fr 1fr}}
.axcard{border:1px solid var(--line);background:var(--surface);padding:16px 18px 18px}
.axcard .t{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.axcard .n{font-size:12px;color:var(--muted);margin-bottom:12px}
.drow{display:grid;grid-template-columns:42px minmax(0,1fr) 78px 22px;gap:9px;align-items:center;
  font-size:12px;padding:3px 0;cursor:pointer;border:none;background:none;width:100%;
  text-align:left;font-family:inherit;color:inherit;border-radius:2px}
.drow:hover{background:var(--surface-2)}
.drow:hover .dn{color:var(--accent)}
.drow .dc{font-family:var(--mono);font-size:11px;color:var(--muted)}
.drow .bar{height:12px;background:var(--surface-3);border-radius:2px;overflow:hidden}
.drow .bar i{display:block;height:100%;border-radius:2px;background:var(--h3)}
.drow.p4 .bar i{background:var(--h4)}
.drow.p2 .bar i{background:var(--h2)}
.drow.zero .bar{background:color-mix(in srgb,var(--crit) 13%,transparent);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--crit) 40%,transparent)}
.drow .dv{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;
  font-variant-numeric:tabular-nums}
.drow.zero .dv{color:var(--crit-ink);font-weight:600}
.dn{display:block;font-size:11.5px;color:var(--ink-soft);line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---- evidências ---- */
.evlist{display:grid;gap:12px;margin:18px 0 0}
.ev{border:1px solid var(--line);background:var(--surface);padding:15px 17px}
.ev .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:9px}
.ev .dimn{font-size:12.5px;color:var(--muted);font-weight:600}
.ev blockquote{margin:0 0 9px;padding:0 0 0 14px;border-left:2px solid var(--line-strong);
  font-family:var(--serif);font-size:.98rem;line-height:1.5;color:var(--ink-soft)}
.ev .para{font-size:13.5px;line-height:1.55;margin:0}
.ev .para b{color:var(--ink)}

/* ---- notas ---- */
.note{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--surface);
  padding:17px 19px;margin:20px 0 0;box-shadow:var(--shadow)}
.note.alert{border-left-color:var(--crit)}
.note h3{margin:0 0 7px}
.note p:last-child{margin-bottom:0}
.two{display:grid;gap:14px;margin:18px 0 0}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.card{border:1px solid var(--line);background:var(--surface);padding:16px 18px}
.card .t{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;margin-bottom:10px}
.card.ok .t{color:var(--accent)}
.card.no .t{color:var(--crit-ink)}
.card ul{margin:0;padding-left:1.05em;font-size:13.5px;color:var(--ink-soft)}
.card li{margin-bottom:5px}
.card li:last-child{margin-bottom:0}
.card li em{font-style:normal;color:var(--muted);font-size:12px}

footer{border-top:1px solid var(--line);background:var(--surface);padding:26px 0 40px;
  font-size:13px;color:var(--muted)}
footer p{margin:0 0 6px;max-width:76ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div id="lock">
  <form id="lockform" autocomplete="off">
    <p class="kicker">IPPLAM × CEPAL · Painel interno</p>
    <h1>Conteúdo protegido</h1>
    <p class="sub">Esta página contém registros de entrevista coletados sob termo de
    consentimento e dados de contato da equipe do projeto. O conteúdo está cifrado:
    sem a senha, ele não existe neste arquivo.</p>
    <label for="pw">Senha</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus
           placeholder="senha do painel" spellcheck="false">
    <button type="submit" id="go">Abrir painel</button>
    <p id="msg" role="status" aria-live="polite"></p>
  </form>
</div>
<div id="app" hidden></div>

<style>
#lock{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--paper)}
#lockform{max-width:46ch;width:100%;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);padding:30px 32px;box-shadow:var(--shadow)}
#lockform h1{font-size:1.5rem;margin:0 0 12px}
#lockform .sub{font-size:14px;color:var(--muted);margin:0 0 22px;line-height:1.55}
#lockform label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
#pw{width:100%;font:15px var(--mono);padding:11px 13px;border:1px solid var(--line-strong);
  border-radius:3px;background:var(--paper);color:var(--ink)}
#pw:focus{outline:2px solid var(--accent);outline-offset:1px}
#go{margin-top:14px;width:100%;font:600 14px var(--sans);padding:11px;cursor:pointer;
  border:1px solid var(--accent);border-radius:3px;background:var(--accent);color:#fff}
#go:hover{filter:brightness(1.08)}
#go[disabled]{opacity:.6;cursor:progress}
#msg{margin:12px 0 0;font-size:13px;min-height:1.2em;color:var(--crit-ink,#a52c2c)}
#msg.ok{color:var(--muted)}
</style>

<script>
(function () {
  "use strict";
  const BLOB = JSON.parse(document.getElementById("locked").textContent);
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const form = document.getElementById("lockform");
  const msg = document.getElementById("msg");
  const go = document.getElementById("go");

  async function abrir(senha) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha),
      "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: b(BLOB.salt), iterations: BLOB.iter, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plano = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b(BLOB.iv) }, key, b(BLOB.ct));
    return new TextDecoder().decode(plano);
  }

  function montar(html) {
    const app = document.getElementById("app");
    app.innerHTML = html;
    // innerHTML não executa <script>: recolhe todos e avalia numa única closure,
    // para que as funções declaradas em um sejam visíveis no seguinte.
    const codigo = [...app.querySelectorAll("script:not([type])")].map(s => s.textContent);
    document.getElementById("lock").remove();
    app.hidden = false;
    new Function(codigo.join("\n;\n"))();
  }

  form.addEventListener("submit", async e => {
    e.preventDefault();
    const senha = document.getElementById("pw").value;
    if (!senha) return;
    go.disabled = true;
    msg.className = "ok";
    msg.textContent = "Derivando a chave…";
    try {
      const html = await abrir(senha);
      msg.textContent = "Abrindo…";
      montar(html);
    } catch (err) {
      go.disabled = false;
      msg.className = "";
      msg.textContent = "Senha incorreta.";
      document.getElementById("pw").select();
    }
  });
})();
</script>
</body></html>
